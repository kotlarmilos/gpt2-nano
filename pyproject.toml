[project]
name = "gpt2-nano"
version = "0.2.0"
description = "A small GPT-2-style transformer implemented from scratch"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
]

[project.optional-dependencies]
data = [
  "pyarrow>=16",
  "requests>=2.31",
  "sentencepiece>=0.2",
]

[project.scripts]
kv-cache-study = "src.kv_cache_study:main"

[tool.setuptools.packages.find]
include = ["src*", "data*"]
